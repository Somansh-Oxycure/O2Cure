<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residential Sourcing Assistant</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --brand: #3b82f6;
            --brand-hover: #2563eb;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 240px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 50%;
            padding: 0.5rem;
            margin-bottom: 1rem;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .company-name {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .search-btn {
            background: var(--brand);
            border: none;
            color: #fff;
            padding: 0.6rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 0.25rem;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--brand-hover);
        }
        
        .wiki-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 0.25rem;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            margin-top: 0.5rem;
            transition: background 0.2s, color 0.2s;
        }
        
        .wiki-btn:hover {
            background: var(--border);
            color: var(--text);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>O₂Cure Residential Sourcing Assistant</h1>
            <p>Click "Search Google Images" to instantly find images for the new residential clients list.</p>
        </header>

        <div class="grid" id="logoGrid"></div>
    </div>

    <script>
        const clients = [
            "Shiv nadar",
            "Antalia",
            "JMD owner",
            "Boult owner",
            "Kunal bahl",
            "Stonex owner",
            "Jaipuria institute",
            "Jaipuria residence pepsi",
            "Jaipuria residence ginni filaments",
            "Architech bobby mukherjee",
            "Mont blanc ceo",
            "Prine pipe owner",
            "Rathi steel owner",
            "Best tech owner",
            "Oswals",
            "Bector residence cremica",
            "Sareen residence Rustex",
            "Ozone locks residence",
            "Euronics",
            "Saleem shervani residence",
            "Shervani industries",
            "PM museum",
            "Dwarka convention center",
            "L&T chennai",
            "Shahid kapoor residence",
            "Hritik residence",
            "Mannat",
            "Akshay kumar residence",
            "Central vista",
            "Ciccu mukhopadhyay residence",
            "Ajanta pharma owner mumbai",
            "25 south realty owner mumbai",
            "Dlf camelias",
            "Camelias kids play area",
            "Camelias club",
            "Dlf thrive",
            "Dlf summit",
            "Sun pharma owner",
            "Umrao residence",
            "Haldiram",
            "Dabur residence",
            "Oberoi residence",
            "Kr mangalam",
            "Sobha realty",
            "Whiteland realty",
            "Tarc",
            "Smart world",
            "M3M bansal residence",
            "Mahajan residence"
        ];

        const grid = document.getElementById('logoGrid');

        clients.forEach((name) => {
            const placeholderUrl = `https://placehold.co/80x80?text=${encodeURIComponent(name.charAt(0))}`;
            
            // Build smart Google Images query
            const searchQuery = encodeURIComponent(`${name} high resolution`);
            const googleImagesUrl = `https://www.google.com/search?q=${searchQuery}&tbm=isch`;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
        <div class="logo-container">
          <img src="${placeholderUrl}" alt="${name} icon">
        </div>
        <div class="company-name" title="${name}">${name}</div>
        <div style="width: 100%;">
            <a class="search-btn" href="${googleImagesUrl}" target="_blank">Search Images</a>
        </div>
      `;
            grid.appendChild(card);
        });
    </script>
</body>

</html>
